<!DOCTYPE html>
<html>
<head>
  <!--
    If you are serving your web app in a path other than the root, change the
    href value below to reflect the base path you are serving from.

    The path provided below has to start and end with a slash "/" in order for
    it to work correctly.

    For more details:
    * https://developer.mozilla.org/en-US/docs/Web/HTML/Element/base

    This is a placeholder for base href that will be replaced by the value of
    the `--base-href` argument provided to `flutter build`.
  -->
  <base href="$FLUTTER_BASE_HREF">

  <meta charset="UTF-8">
  <meta content="IE=Edge" http-equiv="X-UA-Compatible">
  <meta name="description" content="Community app for Korean moms in the US.">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <!-- iOS meta tags & icons -->
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black">
  <meta name="apple-mobile-web-app-title" content="MOMO">
  <link rel="apple-touch-icon" href="icons/Icon-192.png">

  <!-- Favicon -->
  <link rel="icon" type="image/png" href="favicon.png"/>

  <title>MOMO</title>
  <link rel="manifest" href="manifest.json">

  <style>
    html, body {
      margin: 0;
      padding: 0;
      height: 100%;
      background: #FFF9F7;
      overflow: hidden;
    }

    /* Minimal splash until Flutter paints its first frame. */
    #momo-loading {
      position: fixed;
      inset: 0;
      z-index: 9999;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 20px;
      background: #FFF9F7;
      transition: opacity 160ms ease-out;
    }

    #momo-loading.hidden {
      opacity: 0;
      pointer-events: none;
    }

    #momo-loading .brand {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      font-size: 40px;
      font-weight: 800;
      letter-spacing: 1.2px;
      color: #FF4D6D;
      line-height: 1.1;
      user-select: none;
    }

    #momo-loading .spinner {
      width: 28px;
      height: 28px;
      border-radius: 50%;
      border: 3px solid #FFE7EA;
      border-top-color: #FF4D6D;
      animation: momo-spin 0.8s linear infinite;
    }

    @keyframes momo-spin {
      to { transform: rotate(360deg); }
    }
  </style>
</head>
<body>
  <div id="momo-loading" aria-busy="true" aria-live="polite">
    <div class="brand">MOMO</div>
    <div class="spinner" role="progressbar" aria-label="Loading"></div>
  </div>

  <!--
    Custom bootstrap lives in web/flutter_bootstrap.js so we can hide the
    loading overlay after Flutter's first app frame.
    Docs: https://docs.flutter.dev/platform-integration/web/initialization
  -->
  <script src="flutter_bootstrap.js" async></script>
</body>
</html>
